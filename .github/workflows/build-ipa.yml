name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ldid dpkg xcbeautify

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Run Official Packaging Script
        run: |
          bash Jailbreak/package.sh

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/jailbreak/stage/Applications/sing-box.app Payload/
          zip -r sing-box.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ios-ipa
          path: sing-box.ipa
