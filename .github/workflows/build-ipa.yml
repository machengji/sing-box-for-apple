name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install ldid dpkg xcbeautify
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Resolve Package Dependencies
        run: |
          mkdir -p build/SourcePackages
          xcodebuild -resolvePackageDependencies \
            -scheme SFI \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages"

      - name: Run Official Packaging Script
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          export XCODEBUILD_CLONED_SOURCE_PACKAGES_DIR_PATH="$PWD/build/SourcePackages"
          bash Jailbreak/package.sh 2>&1 | tee build.log || {
            echo "========== BUILD FAILED DETAILED LOG =========="
            tail -n 120 build.log
            exit 1
          }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/jailbreak/stage/Applications/sing-box.app Payload/
          zip -r sing-box.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ios-ipa
          path: sing-box.ipa
